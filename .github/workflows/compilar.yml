# Exporta el juego para navegador, Windows y macOS con Godot en modo headless.
# En cada PR deja las versiones como artefactos; al subir una etiqueta v*
# (por ejemplo v0.1) las publica en una Release de GitHub.
name: Compilar

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar Godot y plantillas de exportación
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          cd "$RUNNER_TEMP"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          mv templates/* "$templates/"
          echo "GODOT=$RUNNER_TEMP/godot" >> "$GITHUB_ENV"

      - name: Importar el proyecto
        run: $GODOT --headless --import

      - name: Exportar
        run: |
          mkdir -p export/web export/windows export/macos
          $GODOT --headless --export-release "Web" export/web/index.html
          $GODOT --headless --export-release "Windows Desktop" export/windows/PlanetForm.exe
          $GODOT --headless --export-release "macOS" export/macos/PlanetForm.zip
          test -f export/web/index.html
          test -f export/windows/PlanetForm.exe
          test -f export/macos/PlanetForm.zip

      - name: Empaquetar
        run: |
          mkdir -p dist
          (cd export/web && zip -qr ../../dist/PlanetForm-web.zip .)
          (cd export/windows && zip -qr ../../dist/PlanetForm-windows.zip .)
          cp export/macos/PlanetForm.zip dist/PlanetForm-macos.zip
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: PlanetForm
          path: dist/*.zip

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
